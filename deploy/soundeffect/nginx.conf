limit_req_zone $binary_remote_addr zone=soundeffect_login:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name soundeffect.ruari.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://soundeffect.ruari.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name soundeffect.ruari.dev;
    ssl_certificate /etc/letsencrypt/live/soundeffect.ruari.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soundeffect.ruari.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/deploy/apps/soundeffect/current/public;
    index index.html;
    client_max_body_size 4k;
    access_log /var/log/nginx/soundeffect-access.log;
    error_log /var/log/nginx/soundeffect-error.log;

    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; worker-src blob:; connect-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    auth_request /_auth;
    error_page 401 = @login_redirect;
    location @login_redirect { return 302 /login; }

    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8018/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /login {
        auth_request off;
        limit_req zone=soundeffect_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8018/login;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_intercept_errors off;
    }
    location /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8018;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
    }
    location /shared/imports/ { alias /home/deploy/apps/soundeffect/data/imports/; }
    location /shared/clips/ { alias /home/deploy/apps/soundeffect/data/clips/; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    gzip on;
    gzip_types text/css application/javascript application/json;
}
